x-common-settings: &common-settings
  restart: ${DOCKER_RESTART_POLICY:-unless-stopped}
  networks:
    - zero-day-network

x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  mongodb:
    <<: *common-settings
    image: mongo:8
    container_name: zero_day_mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE__USER:-app_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE__PASSWORD:-change_me}
      MONGO_INITDB_DATABASE: ${DATABASE__NAME:-zero_day_db}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      <<: *common-healthcheck
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${DATABASE__USER:-app_admin}",
          "--password",
          "${DATABASE__PASSWORD:-change_me}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.getSiblingDB('admin').adminCommand('ping')",
        ]

  redis:
    <<: *common-settings
    image: redis:8.6-alpine
    container_name: zero_day_redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD:-change_me}
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning

    volumes:
      - redis_data:/data

    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-change_me}", "ping"]

volumes:
  mongo_data:
    driver: local

  redis_data:
    driver: local

networks:
  zero-day-network:
    driver: bridge
