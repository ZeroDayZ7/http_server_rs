# config/settings.toml

[server]
host = "127.0.0.1"
port = 8080
shutdown_timeout = 30

[log]
level = "debug"

[cors]
allowed_origin = "http://localhost:3000"
allowed_methods = ["GET", "POST", "OPTIONS", "PATCH"]
max_age = 3600

[database]
host = "127.0.0.1"
port = 27017
name = "zero_day_db"
pool_size = 5
auth_source = "zero_day_db"

[redis]
host = "127.0.0.1"
port = 6379
db = 0

[rate_limit]
global_per_second = 3
global_burst = 5
health_per_second = 360
health_burst = 3
auth_per_second = 12
auth_burst = 2