[package]
name = "http_server_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }

# Redis Client (Fred) - NAPRAWIONE: zmieniony feature na tokio-spawn
fred = { version = "10.1.0", features = ["serde-json", "enable-rustls", "i-scripts"] }

# Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

# Configuration & Env
config = "0.15"
dotenvy = "0.15"

# Middleware & Tower
tower = "0.5"
tower_governor = "0.8.0"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.13", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
governor = "0.10.4"
thiserror = "2.0.18"
anyhow = "1.0.102"
