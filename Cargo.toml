[package]
name = "http_server_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono", "json"] }
tracing-appender = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }